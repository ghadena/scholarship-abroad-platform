# Copy this file to .streamlit/credentials.yaml and fill in real values.
# credentials.yaml is gitignored — never commit it.
#
# Generate a bcrypt hash in Python:
#   python -c "import streamlit_authenticator as sa; print(sa.Hasher(['yourpassword']).generate())"
#
# role: either "admin" or "entry"

credentials:
  usernames:
    admin_user:
      email: admin@example.com
      name: Admin User
      password: "$2b$12$REPLACE_WITH_BCRYPT_HASH_OF_YOUR_ADMIN_PASSWORD"
      role: admin
    data_entry_user:
      email: entry@example.com
      name: Entry User
      password: "$2b$12$REPLACE_WITH_BCRYPT_HASH_OF_YOUR_ENTRY_PASSWORD"
      role: entry

cookie:
  expiry_days: 7
  key: "CHANGE_ME_TO_A_RANDOM_SECRET_STRING"
  name: scholarship_auth
