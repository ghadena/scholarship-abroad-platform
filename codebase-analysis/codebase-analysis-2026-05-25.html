* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.chip { padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); font-size: 11px; cursor: pointer; transition: all .15s; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
#zoom-btns { margin-left: auto; display: flex; gap: 6px; }
.zbtn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 12px; cursor: pointer; }
.zbtn:hover { border-color: var(--accent); }
#main { display: flex; flex: 1; overflow: hidden; }
#canvas-wrap { flex: 1; overflow: hidden; position: relative; cursor: grab; }
#canvas-wrap.panning { cursor: grabbing; }
#svg-root { width: 100%; height: 100%; display: block; }
#sidebar { width: 300px; min-width: 300px; background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px; font-size: 12px; flex-shrink: 0; }
#sidebar h2 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.sb-section { margin-bottom: 14px; }
.sb-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.sb-value { color: var(--text); line-height: 1.5; }
.sb-plain { color: var(--accent); font-style: italic; line-height: 1.5; margin-top: 4px; }
.sb-path { font-family: monospace; font-size: 11px; color: #7bd389; word-break: break-all; }
.sb-note { color: var(--muted); padding: 2px 0; line-height: 1.4; }
.sb-note::before { content: '• '; color: var(--accent); }
.edge-item { padding: 3px 0; color: var(--muted); }
.edge-item span { color: var(--text); }
.finding { padding: 6px 0; border-bottom: 1px solid var(--border); line-height: 1.5; color: var(--muted); }
.finding:last-child { border-bottom: none; }
.finding strong { color: var(--accent); }
.legend { display: flex; flex-direction: column; gap: 5px; }
.leg-row { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
.leg-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
.badge-fix { background: #22c55e; color: #000; border-radius: 50%; width: 14px; height: 14px; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.badge-bug { background: #ef4444; color: #fff; border-radius: 50%; width: 14px; height: 14px; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  { from: 'page_entry',  to: 'students_tbl',    kind: 'db', label: 'INSERT student', tag: ['data-entry','all'] },
  { from: 'page_entry',  to: 'accomp_tbl',      kind: 'db', label: 'INSERT accompaniments', tag: ['data-entry','all'] },
  { from: 'page_records',to: 'deletion_tbl',    kind: 'db', label: 'create_deletion_request():205', tag: ['records','all'] },
  { from: 'page_admin',  to: 'deletion_tbl',    kind: 'db', label: 'resolve_deletion_request():47', tag: ['admin','all'] },
  { from: 'page_admin',  to: 'students_tbl',    kind: 'db', label: 'delete_student():94', tag: ['admin','all'] },
  { from: 'bulk_import', to: 'students_tbl',    kind: 'db', label: 'INSERT ON CONFLICT flag', tag: ['import','all'] },
  { from: 'bulk_import', to: 'accomp_tbl',      kind: 'db', label: 'INSERT (no upsert)', tag: ['import','all'] },
  { from: 'bulk_import', to: 'enrichment_tbl',  kind: 'db', label: 'INSERT ON CONFLICT UPDATE', tag: ['import','all'] },

  // Core logic calls
  { from: 'page_entry',  to: 'validation',   kind: 'normal', label: 'validate_student_form():125', tag: ['data-entry','all'] },
  { from: 'database',    to: 'duplicates',   kind: 'normal', label: 'flag_soft_duplicates():253', tag: ['duplicates','all'] },
  { from: 'page_admin',  to: 'duplicates',   kind: 'normal', label: 'find_duplicates():64', tag: ['admin','duplicates','all'] },
  { from: 'bulk_import', to: 'validation',   kind: 'normal', label: 'derive_gender/verify_birthday:21', tag: ['import','all'] },
  { from: 'import_missing',to: 'bulk_import',kind: 'normal', label: 'imports import_family()', tag: ['import','all'] },
  { from: 'find_missing',  to: 'excel_source',kind: 'api', label: 'reads Excel', tag: ['import','all'] },
  { from: 'bulk_import',   to: 'excel_source',kind: 'api', label: 'reads 3 sheets', tag: ['import','all'] },

  // External connections
  { from: 'database',   to: 'neon',           kind: 'api', label: 'psycopg2 sslmode=require', tag: ['all'] },
  { from: 'dq_report',  to: 'neon',           kind: 'api', label: 'psycopg2 direct', tag: ['import','all'] },
  { from: 'check_count',to: 'neon',           kind: 'api', label: 'psycopg2 direct', tag: ['import','all'] },
  { from: 'auth',       to: 'streamlit_cloud',kind: 'mount', label: 'reads st.secrets', tag: ['auth','all'] },
  { from: 'database',   to: 'students_tbl',   kind: 'mount', label: 'COALESCE join view', tag: ['all'] },
  { from: 'students_tbl',to: 'enrichment_tbl',kind: 'db',   label: 'LEFT JOIN ON national_id', tag: ['all'] },
];

const FIXES = {};

const KNOWN_BUGS = {
  'accomp_tbl': [
    { sev: 'high', ref: 'database.py:54', t: 'No UNIQUE constraint — re-running import without TRUNCATE creates duplicate family rows' },
  ],
  'page_import': [
    { sev: 'low', ref: 'app/pages/4_Import.py', t: 'Info-only page; no in-app bulk import UI — users must use CLI' },
  ],
};

// ─────────────────────────────────────────────────────────────
// FILTER CHIPS
// ─────────────────────────────────────────────────────────────
const CHIPS = [
  { id: 'overview',   label: 'Overview (critical path)' },
  { id: 'auth',       label: 'Auth' },
  { id: 'data-entry', label: 'Data Entry' },
  { id: 'records',    label: 'Records' },
  { id: 'dashboard',  label: 'Dashboard' },
  { id: 'report',     label: 'Report' },
  { id: 'export',     label: 'Export' },
  { id: 'import',     label: 'Import' },
  { id: 'admin',      label: 'Admin' },
  { id: 'duplicates', label: 'Duplicates' },
  { id: 'all',        label: 'Show all wires' },
  { id: 'bugs',       label: '🐛 Known issues' },
];

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let activeFilter = 'overview';
let selectedNode = null;
let tx = -80, ty = 20, scale = 0.72;
let dragging = false, lastX = 0, lastY = 0;

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
const svg = document.getElementById('scene');
const EDGE_COLORS = { critical:'#ff3860', db:'#ffb86b', normal:'#555', mount:'#4ea1ff', api:'#ff6b9d' };
const NODE_COLORS = { entry:'#4ea1ff', route:'#7bd389', service:'#c792ea', db:'#ffb86b', external:'#ff6b9d' };

function nodeCenter(n) { return { x: n.x + n.w/2, y: n.y + n.h/2 }; }

function edgeVisible(e) {
  if (activeFilter === 'bugs') return false;
  if (activeFilter === 'all') return true;
  if (activeFilter === 'overview') return e.tag.includes('overview');
  return e.tag.includes(activeFilter);
}

function nodeVisible(n) {
  if (activeFilter === 'bugs') return Object.keys(KNOWN_BUGS).includes(n.id);
  if (activeFilter === 'all') return true;
  if (activeFilter === 'overview') return n.tag.includes('overview');
  return n.tag.includes(activeFilter);
}

function connectedNodeIds(nodeId) {
  const ids = new Set([nodeId]);
  edges.forEach(e => {
    if (e.from === nodeId) ids.add(e.to);
    if (e.to === nodeId) ids.add(e.from);
  });
  return ids;
}

function render() {
  svg.innerHTML = '';

  const connected = selectedNode ? connectedNodeIds(selectedNode) : null;

  // Clusters
  clusters.forEach(c => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', c.x); rect.setAttribute('y', c.y);
    rect.setAttribute('width', c.w); rect.setAttribute('height', c.h);
    rect.setAttribute('rx', 10);
    rect.setAttribute('fill', c.color || '#1a1a1a');
    rect.setAttribute('stroke', '#2a2a2a');
    rect.setAttribute('stroke-width', '1');
    svg.appendChild(rect);
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x', c.x + c.w/2); txt.setAttribute('y', c.y + 20);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-size', '11'); txt.setAttribute('font-weight', '600');
    txt.setAttribute('fill', '#8a8a8a'); txt.setAttribute('font-family', 'Segoe UI, system-ui, sans-serif');
    txt.textContent = c.label;
    svg.appendChild(txt);
  });

  // Edges
  edges.forEach(e => {
    const fromN = nodes.find(n=>n.id===e.from);
    const toN   = nodes.find(n=>n.id===e.to);
    if (!fromN || !toN) return;
    const show = edgeVisible(e) && nodeVisible(fromN) && nodeVisible(toN);
    if (!show) return;

    const dimmed = connected && (!connected.has(e.from) || !connected.has(e.to));
    const color = EDGE_COLORS[e.kind] || '#555';
    const fc = nodeCenter(fromN), tc = nodeCenter(toN);
    const dx = Math.abs(tc.x - fc.x);
    const cx1 = fc.x + dx * 0.5, cy1 = fc.y;
    const cx2 = tc.x - dx * 0.5, cy2 = tc.y;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${fc.x} ${fc.y} C${cx1} ${cy1}, ${cx2} ${cy2}, ${tc.x} ${tc.y}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', e.kind==='critical' ? '2' : '1.2');
    path.setAttribute('stroke-dasharray', e.kind==='mount' ? '4,3' : 'none');
    path.setAttribute('opacity', dimmed ? '0.08' : (e.kind==='critical' ? '0.9' : '0.45'));
    path.setAttribute('marker-end', `url(#arr-${e.kind})`);
    svg.appendChild(path);

    if (e.label && !dimmed) {
      const mx = (fc.x + tc.x)/2, my = (fc.y + tc.y)/2 - 6;
      const lt = document.createElementNS('http://www.w3.org/2000/svg','text');
      lt.setAttribute('x', mx); lt.setAttribute('y', my);
      lt.setAttribute('text-anchor', 'middle');
      lt.setAttribute('font-size', '9'); lt.setAttribute('fill', color);
      lt.setAttribute('font-family', 'monospace');
      lt.setAttribute('opacity', '0.75');
      lt.textContent = e.label.length > 28 ? e.label.slice(0,25)+'…' : e.label;
      svg.appendChild(lt);
    }
  });

  // Nodes
  nodes.forEach(n => {
    const vis = nodeVisible(n);
    const dimmed = (!vis) || (connected && !connected.has(n.id));
    const color = NODE_COLORS[n.color] || '#4ea1ff';
    const isSelected = selectedNode === n.id;
    const isCritical = n.critical;
    const hasBug = KNOWN_BUGS[n.id];
    const hasFix = FIXES[n.id];

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('cursor', 'pointer');
    g.setAttribute('opacity', dimmed ? '0.15' : '1');
    g.setAttribute('data-id', n.id);

    // node rect
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
    rect.setAttribute('rx', 7);
    rect.setAttribute('fill', '#1c1c1c');
    rect.setAttribute('stroke', isSelected ? '#fff' : color);
    rect.setAttribute('stroke-width', isCritical ? '2.2' : (isSelected ? '2' : '1.2'));
    g.appendChild(rect);

    // top color bar
    const bar = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bar.setAttribute('x', n.x); bar.setAttribute('y', n.y);
    bar.setAttribute('width', n.w); bar.setAttribute('height', 4);
    bar.setAttribute('rx', 7);
    bar.setAttribute('fill', color);
    bar.setAttribute('opacity', '0.7');
    g.appendChild(bar);

    // label
    const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x', n.x + 10); lbl.setAttribute('y', n.y + 22);
    lbl.setAttribute('font-size', '12'); lbl.setAttribute('font-weight', '600');
    lbl.setAttribute('fill', '#e8e8e8'); lbl.setAttribute('font-family', 'Segoe UI, system-ui, sans-serif');
    lbl.textContent = n.label.length > 22 ? n.label.slice(0,20)+'…' : n.label;
    g.appendChild(lbl);

    // sub label
    const sub = document.createElementNS('http://www.w3.org/2000/svg','text');
    sub.setAttribute('x', n.x + 10); sub.setAttribute('y', n.y + 36);
    sub.setAttribute('font-size', '9.5'); sub.setAttribute('fill', '#8a8a8a');
    sub.setAttribute('font-family', 'Segoe UI, system-ui, sans-serif');
    sub.textContent = n.sub.length > 28 ? n.sub.slice(0,26)+'…' : n.sub;
    g.appendChild(sub);

    // critical badge
    if (isCritical) {
      const cbg = document.createElementNS('http://www.w3.org/2000/svg','rect');
      cbg.setAttribute('x', n.x+n.w-44); cbg.setAttribute('y', n.y+8);
      cbg.setAttribute('width', 36); cbg.setAttribute('height', 13);
      cbg.setAttribute('rx', 6); cbg.setAttribute('fill', '#ff3860');
      g.appendChild(cbg);
      const ct = document.createElementNS('http://www.w3.org/2000/svg','text');
      ct.setAttribute('x', n.x+n.w-26); ct.setAttribute('y', n.y+18);
      ct.setAttribute('font-size', '8'); ct.setAttribute('fill', '#fff');
      ct.setAttribute('text-anchor', 'middle'); ct.setAttribute('font-weight', '700');
      ct.textContent = 'CORE';
      g.appendChild(ct);
    }

    // bug badge
    if (hasBug) {
      const bugCount = hasBug.length;
      const bx = n.x + n.w - 10, by = n.y + (isCritical ? 28 : 8);
      const bc = document.createElementNS('http://www.w3.org/2000/svg','circle');
      bc.setAttribute('cx', bx); bc.setAttribute('cy', by); bc.setAttribute('r', 8);
      bc.setAttribute('fill', '#ef4444');
      g.appendChild(bc);
      const bt = document.createElementNS('http://www.w3.org/2000/svg','text');
      bt.setAttribute('x', bx); bt.setAttribute('y', by+3);
      bt.setAttribute('text-anchor','middle'); bt.setAttribute('font-size','9');
      bt.setAttribute('font-weight','700'); bt.setAttribute('fill','#fff');
      bt.textContent = bugCount;
      g.appendChild(bt);
    }

    g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n.id); });
    g.addEventListener('mouseenter', () => { if (!selectedNode) hoverNode(n.id); });
    g.addEventListener('mouseleave', () => { if (!selectedNode) showDefaultSidebar(); });
    svg.appendChild(g);
  });
}

// ─────────────────────────────────────────────────────────────
// SIDEBAR
// ─────────────────────────────────────────────────────────────
function showDefaultSidebar() {
  document.getElementById('sb-content').innerHTML = `
    <div class="sb-section">
      <div class="sb-label">Notable findings</div>
      <div class="finding"><strong>DEAD CODE:</strong> app/importer.py was removed (SQLite-only, no callers). app/pages/4_Import.py is display-only — no in-app bulk import UI.</div>
      <div class="finding"><strong>BUG — accompaniments table:</strong> No UNIQUE constraint. Re-running bulk_import.py without TRUNCATE first will double all family rows (database.py:54).</div>
      <div class="finding"><strong>ARCHITECTURE — critical import order:</strong> auth.py MUST be imported before database.py on every page. auth.py injects DATABASE_URL at module load time; database.py reads it once and never again (auth.py:19, database.py:22).</div>
      <div class="finding"><strong>ENRICHMENT WINS:</strong> fetch_full_students_df() uses COALESCE — student_enrichment beats placeholder values in students for every study field. Always use this for analytics (database.py:267).</div>
      <div class="finding"><strong>remaining_study_months not stored:</strong> Calculated dynamically as (end_date − today)/30.44 at every report/page render — never stale.</div>
      <div class="finding"><strong>SPECIALIZATION edge case:</strong> "Specialization" only exists in student_enrichment.certificate — NOT in students.study_level CHECK constraint. COALESCE serves it correctly but raw students table cannot hold it.</div>
      <div class="finding"><strong>? suffix = conflict flag:</strong> Any student_id ending in ? was inserted with a conflict. Sheet 2 of the data quality report catches these for manual review (generate_data_quality_report.py).</div>
    </div>
    <div class="sb-section">
      <div class="sb-label">Legend — edge colours</div>
      <div class="legend">
        <div class="leg-row"><div class="leg-swatch" style="background:#ff3860"></div>Critical path</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#ffb86b"></div>DB read / write</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#ff6b9d"></div>External API / file</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#4ea1ff"></div>Mount / secret injection</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#555"></div>Internal function call</div>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-label">Legend — node border colours</div>
      <div class="legend">
        <div class="leg-row"><div class="leg-swatch" style="background:#4ea1ff"></div>Entry / Auth</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#7bd389"></div>Page (UI route)</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#c792ea"></div>Core service</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#ffb86b"></div>Data / DB table</div>
        <div class="leg-row"><div class="leg-swatch" style="background:#ff6b9d"></div>CLI script / External</div>
      </div>
    </div>`;
}

function hoverNode(id) {
  const n = nodes.find(x=>x.id===id);
  if (!n) return;
  const inEdges  = edges.filter(e=>e.to===id);
  const outEdges = edges.filter(e=>e.from===id);
  const bugs = KNOWN_BUGS[id] || [];
  const fixes = FIXES[id] || [];
  document.getElementById('sb-content').innerHTML = `
    <div class="sb-section">
      <div class="sb-label">File / node</div>
      <div class="sb-value">${n.label}</div>
      <div class="sb-path">${n.path || ''}</div>
    </div>
    <div class="sb-section">
      <div class="sb-label">Role</div>
      <div class="sb-value">${n.role || ''}</div>
      <div class="sb-plain">${n.plain || ''}</div>
    </div>
    ${(n.notes||[]).length ? `<div class="sb-section"><div class="sb-label">Notes</div>${n.notes.map(nt=>`<div class="sb-note">${nt}</div>`).join('')}</div>` : ''}
    ${inEdges.length ? `<div class="sb-section"><div class="sb-label">Incoming</div>${inEdges.map(e=>`<div class="edge-item">← <span>${e.from}</span>: ${e.label||''}</div>`).join('')}</div>` : ''}
    ${outEdges.length ? `<div class="sb-section"><div class="sb-label">Outgoing</div>${outEdges.map(e=>`<div class="edge-item">→ <span>${e.to}</span>: ${e.label||''}</div>`).join('')}</div>` : ''}
    ${bugs.length ? `<div class="sb-section"><div class="sb-label">Known issues</div>${bugs.map(b=>`<div class="finding" style="color:#ef9999"><strong>[${b.sev.toUpperCase()}]</strong> ${b.t}<br><span style="color:#555;font-size:10px">${b.ref}</span></div>`).join('')}</div>` : ''}
    ${fixes.length ? `<div class="sb-section"><div class="sb-label">Fixes</div>${fixes.map(f=>`<div class="finding" style="color:#86efac">${f.t}</div>`).join('')}</div>` : ''}`;
}

function selectNode(id) {
  selectedNode = selectedNode === id ? null : id;
  if (selectedNode) hoverNode(selectedNode);
  else showDefaultSidebar();
  render();
}

// ─────────────────────────────────────────────────────────────
// CHIPS
// ─────────────────────────────────────────────────────────────
function buildChips() {
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  CHIPS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeFilter===c.id ? ' active' : '');
    btn.textContent = c.label;
    btn.onclick = () => { activeFilter = c.id; selectedNode = null; buildChips(); showDefaultSidebar(); render(); };
    wrap.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────
// PAN + ZOOM
// ─────────────────────────────────────────────────────────────
function applyTransform() {
  document.getElementById('scene').setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}

function zoom(factor, cx, cy) {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const px = cx !== undefined ? cx - rect.left : rect.width/2;
  const py = cy !== undefined ? cy - rect.top  : rect.height/2;
  const wx = (px - tx)/scale, wy = (py - ty)/scale;
  scale = Math.max(0.2, Math.min(3, scale * factor));
  tx = px - wx * scale;
  ty = py - wy * scale;
  applyTransform();
}

function fitView() {
  const wrap = document.getElementById('canvas-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const xs = nodes.map(n=>n.x), ys = nodes.map(n=>n.y);
  const xe = nodes.map(n=>n.x+n.w), ye = nodes.map(n=>n.y+n.h);
  const minX = Math.min(...xs)-20, minY = Math.min(...ys)-20;
  const maxX = Math.max(...xe)+20, maxY = Math.max(...ye)+20;
  const sw = maxX-minX, sh = maxY-minY;
  scale = Math.min(W/sw, H/sh, 1);
  tx = (W - sw*scale)/2 - minX*scale;
  ty = (H - sh*scale)/2 - minY*scale;
  applyTransform();
}

const canvasWrap = document.getElementById('canvas-wrap');
canvasWrap.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvasWrap.classList.add('panning');
});
window.addEventListener('mouseup', () => { dragging = false; canvasWrap.classList.remove('panning'); });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
}, { passive: false });
document.getElementById('svg-root').addEventListener('click', () => {
  selectedNode = null; showDefaultSidebar(); render();
});

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
buildChips();
render();
showDefaultSidebar();
setTimeout(fitView, 50);
</script>
